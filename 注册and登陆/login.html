<!DOCTYPE html>
<html lang="en">
<title>重置年</title>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="css/css.css">

	<style>
		.error {
			color: red;
		}
	</style>

<script src="js/accounts.js" defer></script>
</head>

<body>

	<section>
		<!-- 登录框 -->
		<div class="container">
			<div class="form">
				<h2 id="logintitle">登录</h2>
				<form id="loginform" data-mode="login" method="post" name="form1">
					<div class="inputBox">
						<input type="text" placeholder="账户" name="username" id="username" required autocomplete="username">
					</div>
					<div class="inputBox">
						<input type="password" placeholder="密码" name="password" id="password" required autocomplete="current-password">
					</div>
					<div class="inputBox">
						<input type="submit" value="登录" id="input1">
					</div>

					<p class="forget">没有账户?<a href="register.html">注册</a></p>
				</form>
			</div>
		</div>
		</div>
	</section>
</body>

</html>
