<!DOCTYPE html>
<html lang="en">
<title>重置年</title>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/css.css">

	<!--
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<meta http-equiv="Refresh" content="2"> -->

	<style>
		.error {
			color: red;
		}
	</style>
<script src="js/accounts.js" defer></script>
</head>

<body>

	<section>
		<!-- 登录框 -->
		<div class="container">
			<div class="form">
				<h2>注册</h2>
				<form id="loginform" data-mode="register" method="post" name="form1">
					<div class="inputBox">
						<input type="text" placeholder="账户" name="username" id="id" required autocomplete="username">
					</div>
					<div class="inputBox">
						<input type="password" placeholder="请输入6~10位密码" name="password" id="password" required minlength="6" maxlength="10" pattern="[a-zA-Z0-9]{6,10}" autocomplete="new-password">
					</div>
					<div class="inputBox">
						<input type="password" placeholder="再次输入密码" name="confirmation" id="repassword" required autocomplete="new-password">
					</div>
					<div class="inputBox">
						<input type="submit" value="注册" id="input1">
					</div>

					<p class="forget">已有账户?<a href="login.html">
							点击登录
						</a></p>
				</form>
			</div>
		</div>
		</div>
		</div>
	</section>
</body>

</html>
