<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王耔樾的个人介绍</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        /* 顶部区域 */
        .header-section {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 20px;
            padding: 25px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-out;
            height: 220px;
        }
        
        .profile-img  img{
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            font-weight: bold;
            margin-right: 50px;
            flex-shrink: 0;
        }
        
        .header-content {
            flex-grow: 1;
        }
        
        h1 {
            font-size: 3.2rem;
            color: #2c3e50;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        
        .tagline {
            font-size: 1.5rem;
            color: #6c757d;
            margin-bottom: 20px;
        }
        
        .quick-info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .quick-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.95rem;
        }
        
        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            height: 380px;
        }
        
        .info-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .info-card:hover {
            transform: translateY(-5px);
        }
        
        .info-card h2 {
            color: #4a6fa5;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed #e9ecef;
        }
        
        .info-label {
            font-weight: 600;
            color: #495057;
            font-size: 1rem;
        }
        
        .info-value {
            color: #6c757d;
            font-size: 1.1rem;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #7a8ca5;
            font-size: 0.95rem;
        }
        .return a{
            color: white;
            position: absolute;
            margin-left: 300px;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;

        }

        .return a:hover {
            background: rgba(132, 32, 41, 1);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: repeat(2, 1fr);
                height: auto;
            }
            
            .header-section {
                height: auto;
                flex-direction: column;
                text-align: center;
                padding: 30px;
            }
            
            .profile-img {
                margin-right: 0;
                margin-bottom: 25px;
            }
            
            .quick-info {
                justify-content: center;
            }
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .tagline {
                font-size: 1.2rem;
            }
            
            .quick-info {
                gap: 15px;
            }
            
            .quick-info-item {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部区域 -->
        <section class="header-section">
            <div class="profile-img"><img src="./456.png" alt=""></div>
            <div class="header-content">
                        <div class="return">
            <a href="../../intro/intro.html">返回上一页</a>
        </div>

        <!-- 页脚 -->
        <footer>
            <p>© 2024 王耔樾 - 个人介绍页面</p >
        </footer>
    </div>
</body>
</html>
