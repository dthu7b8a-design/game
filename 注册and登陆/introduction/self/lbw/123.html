<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李博文的个人介绍</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
                .return a{
            color: white;
            margin-top: 10px;
            margin-left: 100px;
            position: absolute;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;

        }

        .return a:hover {
            background: rgba(132, 32, 41, 1);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            animation: fadeIn 1.2s ease-out;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-img img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 1.3rem;
            color: #4a6fa5;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #7a8ca5;
            margin-bottom: 25px;
        }
        
        .content {
            padding: 20px 0;
        }
        
        .about {
            background: #f9fbfd;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .about p {
            margin-bottom: 15px;
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        .hobbies {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .hobby {
            background: linear-gradient(135deg, #6c8ec6 0%, #4a6fa5 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s ease;
        }
        
        .hobby:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.3);
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #7a8ca5;
            font-size: 0.95rem;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
                margin: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .title, .subtitle {
                font-size: 1.1rem;
            }
            
            .about p {
                font-size: 1rem;
            }
            
            .hobby {
                font-size: 0.9rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-img"><img src="./lbw.png" alt=""></div>
                    <div class="return">
            <a href="../../intro/intro.html">返回上一页</a>
        </div>
            <h1>李博文</h1>
            <div class="title">北京书院2024级</div>
            <div class="subtitle">CIO / 剧本编辑</div>
        </header>
        
        <div class="content">
            <div class="about">
                <p>热爱生活，平时喜欢弹吉他，拼模型，打游戏，看小说…</p >
                <p>性格开朗，乐天派，拖延症晚期。</p >
                <p>有两只眼睛，一个鼻子，两个耳朵一张嘴。普通的一名大二学生。</p >
                
                <div class="hobbies">
                    <div class="hobby"><i class="fas fa-guitar"></i> 弹吉他</div>
                    <div class="hobby"><i class="fas fa-puzzle-piece"></i> 拼模型</div>
                    <div class="hobby"><i class="fas fa-gamepad"></i> 打游戏</div>
                    <div class="hobby"><i class="fas fa-book"></i> 看小说</div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2024 李博文 - 个人介绍页面</p >
        </footer>
    </div>
</body>
</html>
