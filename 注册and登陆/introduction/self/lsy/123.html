<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人介绍 - 北京书院2411班</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            transition: all 0.4s cubic-bezier(0.215, 0.610, 0.355, 1);
        }
        
        .container:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
        }
        
        /* 左侧个人信息区域 */
        .profile-section {
            flex: 0 0 45%;
            background: linear-gradient(to bottom, #f0f5ff, #ffffff);
            padding: 50px;
            display: flex;
            flex-direction: column;
        }
        
        /* 右侧内容区域 */
        .content-section {
            flex: 1;
            padding: 50px;
            background: #ffffff;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0, 113, 227, 0.2);
            margin: 0 auto 25px;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        
        .avatar:hover {
            transform: scale(1.03);
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .return a{
            color: white;
            position: absolute;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;

        }

        .return a:hover {
            background: rgba(132, 32, 41, 1);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 30px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 10px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0071e3;
        }
        
        .section-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 12px;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background: #0071e3;
            border-radius: 3px;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .skill-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #0071e3;
            background: #ffffff;
        }
        
        .skill-icon {
            width: 45px;
            height: 45px;
            background: rgba(0, 113, 227, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: #0071e3;
            font-size: 1.2rem;
        }
        
        .skill-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #495057;
        }
        
        .interest-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .interest-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #0071e3;
            background: #ffffff;
        }
        
        .interest-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .interest-icon {
            width: 50px;
            height: 50px;
            background: rgba(0, 113, 227, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: #0071e3;
            font-size: 1.5rem;
        }
        
        .interest-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .interest-description {
            color: #6c757d;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        
        .friend-section {
            margin-top: 30px;
        }
        
        .offer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }
        
        .offer-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s ease;
        }
        
        .offer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }
        
        .offer-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .offer-list {
            list-style: none;
        }
        
        .offer-item {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            font-size: 1.1rem;
        }
        
        .offer-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 0.9rem;
        }
        
        .offer-icon.check {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }
        
        .offer-icon.circle {
            background: rgba(0, 113, 227, 0.1);
            color: #0071e3;
        }


        
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
                max-width: 800px;
            }
            
            .profile-section, .content-section {
                flex: none;
                width: 100%;
            }
            
            .offer-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧个人信息区域 -->
        <div class="profile-section">
            <div class="profile-header">
                <div class="avatar">
                    <img src="./456.png" alt="个人照片">
                </div>
                <h1>北京书院2411班</h1>
                <p class="subtitle">大二学生 · 热爱生活</p>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">性别</div>
                        <div class="stat-value">男</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">身高</div>
                        <div class="stat-value">180cm</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">体重</div>
                        <div class="stat-value">60kg</div>
                    </div>
                </div>
            </div>
            
            <h2 class="section-title">核心技能</h2>
            
            <div class="skills-grid">
                <div class="skill-card">
                    <div class="skill-icon">
                        <i class="fa fa-cutlery"></i>
                    </div>
                    <div class="skill-text">饿了知道吃饭</div>
                </div>
                
                <div class="skill-card">
                    <div class="skill-icon">
                        <i class="fa fa-tint"></i>
                    </div>
                    <div class="skill-text">渴了知道喝水</div>
                </div>
                
                <div class="skill-card">
                    <div class="skill-icon">
                        <i class="fa fa-umbrella"></i>
                    </div>
                    <div class="skill-text">下雨了知道往家跑</div>
                </div>
                
                <div class="skill-card">
                    <div class="skill-icon">
                        <i class="fa fa-heartbeat"></i>
                    </div>
                    <div class="skill-text">活着会喘气</div>
                </div>
            </div>
            <div class="return">
                <a href="../../intro/intro.html">返回上一页</a>
            </div>
        </div>
        
        <!-- 右侧内容区域 -->
        <div class="content-section">
            <h2 class="section-title">兴趣爱好</h2>
            
            <div class="interest-card">
                <div class="interest-header">
                    <div class="interest-icon">
                        <i class="fa fa-futbol-o"></i>
                    </div>
                    <h3 class="interest-title">运动</h3>
                </div>
                <p class="interest-description">
                    篮球、足球、台球、羽毛球... 只要是圆的都会
                </p>
            </div>
            
            <div class="interest-card">
                <div class="interest-header">
                    <div class="interest-icon">
                        <i class="fa fa-camera"></i>
                    </div>
                    <h3 class="interest-title">摄影</h3>
                </div>
                <p class="interest-description">
                    喜欢用镜头记录生活中的美好瞬间，但并不擅长
                </p>
            </div>
            
            <div class="friend-section">
                <h2 class="section-title">寻找志同道合的朋友</h2>
                
                <div class="offer-grid">
                    <div class="offer-card">
                        <div class="offer-title">我能带来</div>
                        <ul class="offer-list">
                            <li class="offer-item">
                                <div class="offer-icon check">
                                    <i class="fa fa-check"></i>
                                </div>
                                <span>球友：各类球类陪练</span>
                            </li>
                            <li class="offer-item">
                                <div class="offer-icon check">
                                    <i class="fa fa-check"></i>
                                </div>
                                <span>摄影：免费拍照服务</span>
                            </li>
                            <li class="offer-item">
                                <div class="offer-icon check">
                                    <i class="fa fa-check"></i>
                                </div>
                                <span>雨天同伴：一起跑回家</span>
                            </li>
                        </ul>
                    </div>
                    
                    <div class="offer-card">
                        <div class="offer-title">希望你</div>
                        <ul class="offer-list">
                            <li class="offer-item">
                                <div class="offer-icon circle">
                                    <i class="fa fa-circle"></i>
                                </div>
                                <span>饿了也知道吃饭</span>
                            </li>
                            <li class="offer-item">
                                <div class="offer-icon circle">
                                    <i class="fa fa-circle"></i>
                                </div>
                                <span>渴了也知道喝水</span>
                            </li>
                            <li class="offer-item">
                                <div class="offer-icon circle">
                                    <i class="fa fa-circle"></i>
                                </div>
                                <span>下雨了也知道往家跑</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 卡片悬停效果增强
        const hoverCards = document.querySelectorAll('.skill-card, .interest-card, .offer-card');
        
        hoverCards.forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-7px)';
                this.style.boxShadow = '0 15px 30px rgba(0, 0, 0, 0.12)';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.05)';
            });
        });
    </script>
</body>
</html>
