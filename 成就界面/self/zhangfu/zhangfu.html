        <script>
            window.onload = function () {
            var index = window.localStorage.userid;
            var array = JSON.parse(window.localStorage.userArr || "[]");
            var userData = array[index] || {};

// 初始化当前角色的成就数据
var roleData = userData['jiabaonan'] || {};
if (Object.keys(roleData).length === 0) {
    roleData = {
        achi1: 0,
        achi2: 0,
        achi3: 0,
        achi4: 0
        /* 其他成就属性 */
    };
    userData['jiabaonan'] = roleData; // 更正这里
    array[index] = userData;   // 添加这一行
}
        console.log('Role Data:', roleData);

    // achi1
    var achi = roleData.achi1;
    if (achi == 1) {
        var tmp = document.getElementById('1');
        tmp.setAttribute('style', 'width: calc(25% - 2rem); margin: 1rem;cursor: pointer; filter:brightness(2);');
        document.getElementById('p11').innerHTML = '赎罪的新生';
        document.getElementById('p12').innerHTML = '背负着沉重愧疚，贾宝南决心用余生去改正错误、换取新开始的复杂情感和坚定誓言。';
    }

    // achi2
    achi = roleData.achi2;
    if (achi == 1) {
        var tmp = document.getElementById('2');
        tmp.setAttribute('style', 'width: calc(25% - 2rem); margin: 1rem;cursor: pointer; filter:brightness(2);');
        document.getElementById('p21').innerHTML = '锒铛入狱';
        document.getElementById('p22').innerHTML = '所谓的“重置年”带来的不是刷新，而是最终的审判和惩罚。牢狱生涯和内心的悔恨将如同无尽的长夜，没有“重置”的希望。';
    }

    // achi3
    achi = roleData.achi3;
    if (achi == 1) {
        var tmp = document.getElementById('3');
        tmp.setAttribute('style', 'width: calc(25% - 2rem); margin: 1rem;cursor: pointer; filter:brightness(2);');
        document.getElementById('p31').innerHTML = '她的“重置年”';
        document.getElementById('p32').innerHTML = '贾宝南期待的刷新没有到来，反而是妻子用最极端的方式给了他一个“了断”，完成了属于她的、残酷的“重置”';
    }

    // achi4
    achi = roleData.achi1 + roleData.achi2 + roleData.achi3;
    if (achi == 3) {
        var tmp = document.getElementById('4');
        tmp.setAttribute('style', 'width: calc(25% - 2rem); margin: 1rem;cursor: pointer; filter:brightness(2);');
        document.getElementById('p41').innerHTML = '所有的假设';
        document.getElementById('p42').innerHTML = '通关全结局';
    }

}
