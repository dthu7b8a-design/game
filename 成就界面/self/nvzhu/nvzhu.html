    <div class="wrapper">
        <script>
            window.onload = function () {
            document.querySelectorAll(".col").forEach(card => {
                card.tabIndex = 0;
                card.setAttribute("role", "button");
                card.addEventListener("keydown", event => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        card.classList.toggle("hover");
                    }
                });
            });
            var index = window.localStorage.userid;
            var array;
            try { array = JSON.parse(window.localStorage.userArr || "[]"); if (!Array.isArray(array)) array = []; }
            catch (error) { array = []; }
            var userData = array[index] || {};

// 初始化当前角色的成就数据
var roleData = userData['linwanxing'] || {};
if (Object.keys(roleData).length === 0) {
    roleData = {
        achi1: 0,
        achi2: 0,
        achi3: 0,
        achi4: 0
        /* 其他成就属性 */
    };
    userData['linwanxing'] = roleData; // 更正这里
    array[index] = userData;   // 添加这一行
}
        console.log('Role Data:', roleData);

    // achi1
    var achi = roleData.achi1;
    if (achi == 1) {
        var tmp = document.getElementById('1');
        tmp.classList.add('is-unlocked');
        document.getElementById('p11').innerHTML = '隐忍与坚强';
        document.getElementById('p12').innerHTML = '林晚星不仅挽救了丈夫的健康，某种程度上也拯救了家庭完整的未来，将家庭从彻底毁灭的边缘拉了回来。但这份“救赎”的代价巨大，且并非完美。';
    }

    // achi2
    achi = roleData.achi2;
    if (achi == 1) {
        var tmp = document.getElementById('2');
        tmp.classList.add('is-unlocked');
        document.getElementById('p21').innerHTML = '无用的让步';
        document.getElementById('p22').innerHTML = '以妥协求生存，反而彻底失去了生存的一切希望。';
    }

    // achi3
    achi = roleData.achi3;
    if (achi == 1) {
        var tmp = document.getElementById('3');
        tmp.classList.add('is-unlocked');
        document.getElementById('p31').innerHTML = '湮灭的骗局';
        document.getElementById('p32').innerHTML = '林晚星利用了“重置年”这个骗局操纵了郑义，而她和郑义之后的生活又何尝不是建立在另一个骗局之上。一切真相大白，骗局崩塌，代价也随之到来。';
    }

    // achi4
    achi = roleData.achi4;
    if (achi == 1) {
        var tmp = document.getElementById('4');
        tmp.classList.add('is-unlocked');
        document.getElementById('p41').innerHTML = '游戏成就';
        document.getElementById('p42').innerHTML = '金币≥50,恭喜你赚到了足够的钱给丈夫治病';
    }
    
    // achi5
    achi = [roleData.achi1, roleData.achi2, roleData.achi3, roleData.achi4].every(value => Number(value) === 1);
    if (achi) {
        var tmp = document.getElementById('5');
        tmp.classList.add('is-unlocked');
        document.getElementById('p51').innerHTML = '所有的假设';
        document.getElementById('p52').innerHTML = '通关全结局';
    }
}
        </script>
