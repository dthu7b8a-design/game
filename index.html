<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重置年</title>
    <style>
        /* 重置样式 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap');      
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', sans-serif; /* 全局使用思源黑体 */
        }
        
        /* 响应式主体样式 */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        
        /* 主游戏容器 - 使用Flex布局确保居中 */
        .game-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            flex-grow: 1;
            z-index: 5;
            padding: 20px;
        }
        
        /* 开始按钮 - 关键优化部分 */
        .start-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: clamp(12px, 4vw, 20px) clamp(40px, 15vw, 60px);
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(45deg, #000000, #797979);
            border-radius: 50px;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.5),
                0 5px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite;
            min-height: 60px; /* 最小高度确保可点击 */
            text-align: center;
            border: none;
            cursor: pointer;
            z-index: 10;
            margin-top: 30vh;
        }
        
        .start-button i {
            margin-right: 10px;
            font-size: 0.9em;
        }
        
        .start-button:hover, .start-button:focus {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 0.8),
                0 10px 40px rgba(0, 0, 0, 0.4);
            background: linear-gradient(45deg, #8d3232, #5032b3);
        }
        
        .start-button:active {
            transform: translateY(0) scale(1);
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.5),
                0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .start-button::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }
        
        .start-button:hover::before {
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 5px 25px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), 0 7px 30px rgba(0, 0, 0, 0.4); }
            100% { box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 5px 25px rgba(0, 0, 0, 0.3); }
        }
        
        /* 统一footer样式 */
        footer {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        footer h2 {
            font-size: clamp(0.9rem, 2vw, 1.2rem); /* 响应式字体大小 */
            color: #fff;
            font-weight: normal;
        }

        /* 响应式设计 - 添加的媒体查询 */
        @media (max-width: 768px) {
            /* 移动设备上调整按钮位置 */
            .start-button {
                margin-top: 20vh;
                padding: clamp(10px, 4vw, 16px) clamp(30px, 12vw, 50px);
                font-size: clamp(1.1rem, 4.5vw, 1.6rem);
            }
            
            /* 调整body内边距 */
            body {
                padding: 10px;
            }
            
            /* 确保按钮在小屏幕上仍然可见 */
            .game-container {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            /* 超小屏幕设备优化 */
            .start-button {
                margin-top: 15vh;
                padding: 12px 30px;
                font-size: 1.2rem;
                min-height: 50px;
            }
            
            /* 调整动画效果，避免在小屏幕上性能问题 */
            .start-button:hover {
                transform: translateY(-3px) scale(1.03);
            }
            
            /* 减小页脚字体大小 */
            footer h2 {
                font-size: 0.8rem;
            }
        }

        @media (max-height: 600px) {
            /* 针对高度较小的设备 */
            .start-button {
                margin-top: 10vh;
            }
        }

        /* 横屏模式优化 */
        @media (orientation: landscape) and (max-height: 500px) {
            .start-button {
                margin-top: 5vh;
                padding: 10px 25px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="game-container">
        <a href="./注册and登陆/login.html" class="start-button">开始游戏
        </a>
    </div>
    
    <div class="footer">
        <p>© 2025 无限灵感工作室 | 版本 1.0</p>
    </div>
    
    <script>
        // 页面加载完成后执行
        window.addEventListener('DOMContentLoaded', () => {
            // 添加点击开始按钮的动画效果
            const startButton = document.querySelector('.start-button');
            
            startButton.addEventListener('click', (e) => {
                e.preventDefault();
                
                // 添加点击效果
                startButton.style.animation = 'none';
                setTimeout(() => {
                    startButton.style.animation = 'pulse 2s infinite';
                }, 10);
                
                // 在移动端显示更友好的提示
                if (window.matchMedia("(pointer: coarse)").matches) {
                    // 触屏设备
                    if (confirm('即将开始游戏，是否继续？')) {
                        window.location.href = startButton.href;
                    }
                } else {
                    // 桌面设备
                    alert('游戏即将开始...');
                    setTimeout(() => {
                        window.location.href = startButton.href;
                    }, 1000);
                }
            });
            
            // 动态加载背景优化
            window.addEventListener('load', () => {
                document.body.style.backgroundImage = "url('./素材/begin.png')";
            });
        });
        
        // 移动端阻止双击缩放
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (event) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>

</body>
</html>
