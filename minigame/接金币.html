<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>键盘控制接金币游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            image-rendering: pixelated;
        }
        
        body {
            font-family: 'Press Start 2P', cursive, sans-serif;
            background: #2c3e50;
            color: #ecf0f1;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
            touch-action: manipulation;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 600px;
            background: #34495e;
            border: 4px solid #2c3e50;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            aspect-ratio: 4/3;
            margin: 0 auto;
        }
        
        /* 响应式调整 - 小屏幕 */
        @media (max-width: 768px) {
            .game-container {
                max-height: 100vh;
                border: none;
                box-shadow: none;
            }
            
            #score {
                font-size: 18px !important;
                padding: 3px 8px !important;
            }
            
            .life {
                width: 18px !important;
                height: 18px !important;
            }
            
            #pen {
                width: 80px !important;
                height: 15px !important;
            }
            
            .jin, .bomb {
                width: 30px !important;
                height: 30px !important;
            }
            
            .jin::before {
                width: 15px !important;
                height: 15px !important;
                top: 7px !important;
                left: 7px !important;
            }
            
            .bomb::before {
                font-size: 16px !important;
                top: 3px !important;
                left: 7px !important;
            }
            
            .bomb::after {
                width: 8px !important;
                height: 8px !important;
                top: -4px !important;
                left: 11px !important;
            }
            
            .instructions {
                font-size: 12px !important;
                padding: 8px !important;
                width: 90% !important;
            }
            
            .title {
                font-size: 24px !important;
                margin-bottom: 15px !important;
            }
            
            .start-btn, .restart-btn {
                padding: 10px 20px !important;
                font-size: 16px !important;
            }
        }
        
        /* 响应式调整 - 超小屏幕 */
        @media (max-width: 480px) {
            #score {
                font-size: 16px !important;
            }
            
            .instructions {
                font-size: 10px !important;
                bottom: 50px !important;
            }
            
            .title {
                font-size: 20px !important;
            }
            
            .start-screen h2 {
                font-size: 24px !important;
            }
            
            .start-screen p {
                font-size: 12px !important;
            }
        }
        
        /* 横屏优化 */
        @media (orientation: landscape) and (max-height: 500px) {
            .game-container {
                max-height: 100vh;
                aspect-ratio: unset;
            }
            
            #pen {
                bottom: 20px !important;
            }
            
            .instructions {
                bottom: 40px !important;
            }
        }
        
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: #2c3e50;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #2c3e50;
        }
        
        #score {
            font-size: 24px;
            color: #f1c40f;
            text-shadow: 2px 2px 0 #000;
            padding: 5px 10px;
            background: #2c3e50;
            border: 2px solid #f1c40f;
        }
        
        .lives {
            display: flex;
            gap: 5px;
        }
        
        .life {
            width: 24px;
            height: 24px;
            background: #f1c40f;
            border: 2px solid #000;
        }
        
        #pen {
            width: 100px;
            height: 20px;
            position: absolute;
            bottom: 30px;
            left: 0;
            background: #3498db;
            border: 2px solid #000;
            box-shadow: 0 4px 0 #2980b9;
            z-index: 5;
        }
        
        .jin {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #f1c40f;
            border: 2px solid #000;
            box-shadow: 0 4px 0 #d35400;
            z-index: 2;
            animation: rotate 3s linear infinite;
            border-radius: 50%;
        }
        
        .jin::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
        }
        
        .bomb {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #e74c3c;
            border: 2px solid #000;
            box-shadow: 0 4px 0 #c0392b;
            z-index: 2;
            border-radius: 50%;
        }
        
        .bomb::before {
            content: "💣";
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 20px;
        }
        
        .bomb::after {
            content: "";
            position: absolute;
            top: -5px;
            left: 15px;
            width: 10px;
            height: 10px;
            background: #f1c40f;
            border: 2px solid #000;
        }
        
        .explosion {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #f1c40f 0%, #e74c3c 70%, transparent 100%);
            border-radius: 50%;
            z-index: 3;
            opacity: 0;
            animation: explode 0.5s ease-out;
        }
        
        @keyframes explode {
            0% { transform: scale(0.1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30px;
            background: #7f8c8d;
            border-top: 4px solid #636e72;
            z-index: 1;
        }
        
        .pixel-cloud {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 80px;
            height: 40px;
            background: #ecf0f1;
            border: 2px solid #000;
            box-shadow: 
                4px 4px 0 #bdc3c7,
                8px 8px 0 #000;
        }
        
        .pixel-cloud::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 10px;
            width: 40px;
            height: 40px;
            background: #ecf0f1;
            border: 2px solid #000;
        }
        
        .pixel-cloud::after {
            content: "";
            position: absolute;
            top: -10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #ecf0f1;
            border: 2px solid #000;
        }
        
        .catch-effect {
            position: absolute;
            color: #f1c40f;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
            animation: catchAnimation 1s ease-out;
        }
        
        .bomb-effect {
            position: absolute;
            color: #e74c3c;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
            animation: catchAnimation 1s ease-out;
        }
        
        @keyframes catchAnimation {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 4px solid #f1c40f;
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        
        .game-over h2 {
            color: #f1c40f;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }
        
        .restart-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 15px;
            border: 2px solid #000;
            box-shadow: 0 4px 0 #219653;
        }
        
        .restart-btn:hover {
            background: #219653;
        }
        
        .instructions {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 14px;
            color: #ecf0f1;
            text-shadow: 1px 1px 0 #000;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border: 2px solid #f1c40f;
            width: 80%;
        }
        
        .title {
            font-size: 36px;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .page-jump-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            border: 2px solid #000;
            box-shadow: 0 4px 0 #d35400;
            z-index: 1000;
        }
        
        .page-jump-btn:hover {
            background: #d35400;
            color: #fff;
        }
        
        /* 新增开始界面和胜利界面的样式 */
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        .start-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            margin-top: 30px;
            border: 2px solid #000;
            box-shadow: 0 4px 0 #219653;
        }
        
        .start-btn:hover {
            background: #219653;
        }
        
        .victory-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 4px solid #f1c40f;
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        
        .victory-screen h2 {
            color: #f1c40f;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }
        
        /* 移动端控制按钮 */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 10px;
            width: 100%;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        
        .mobile-btn {
            width: 80px;
            height: 60px;
            background: rgba(52, 152, 219, 0.5);
            border: 2px solid #000;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <button class="page-jump-btn" id="jumpBtn">跳过游戏</button>
    
    <h1 class="title">接金币</h1>
    
    <div class="game-container">
        <div class="header">
            <div id="score">0</div>
            <div class="lives">
                <div class="life"></div>
                <div class="life"></div>
                <div class="life"></div>
            </div>
        </div>
        
        <div id="pen"></div>
        <div class="ground"></div>
        
        <div class="pixel-cloud"></div>
        
        <div class="instructions">使用左右方向键移动平台接住金币，注意避开红色炸弹！</div>
        
        <div class="game-over">
            <h2>游戏结束</h2>
            <p>你的最终得分: <span id="finalScore">0</span></p>
            <button class="restart-btn">重新开始</button>
        </div>
        
        <!-- 新增开始游戏界面 -->
        <div class="start-screen" id="startScreen">
            <h2 style="color: #f1c40f; font-size: 36px; margin-bottom: 30px; text-shadow: 3px 3px 0 #000;">接金币游戏</h2>
            <p style="color: #ecf0f1; margin-bottom: 20px; text-align: center; max-width: 80%;">
                使用左右方向键移动平台接住金币<br>
                注意避开红色炸弹！<br>
                达到50分即可获胜！
            </p>
            <button class="start-btn" id="startBtn">开始游戏</button>
        </div>
        
        <!-- 新增胜利界面 -->
        <div class="victory-screen" id="victoryScreen">
            <h2>恭喜获胜！</h2>
            <p>你的最终得分: <span id="victoryScore">0</span></p>
            <button class="restart-btn">再玩一次</button>
        </div>
        
        <!-- 移动端控制按钮 -->
        <div class="mobile-controls">
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn" id="rightBtn">→</div>
        </div>
    </div>

    <script>
        // 游戏变量
        let count = 0;
        let gameActive = false; // 初始状态改为false
        let lives = 3;
        let gameSpeed = 5;
        let penSpeed = 7;
        let itemInterval; // 用于存储创建物品的interval
        let gameWon = false; // 新增：记录游戏是否获胜
        
        // 获取DOM元素
        const pen = document.getElementById('pen');
        const startScreen = document.getElementById('startScreen');
        const victoryScreen = document.getElementById('victoryScreen');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const jumpBtn = document.getElementById('jumpBtn');
        
        // 键盘控制状态
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };
        
        // 检测是否是移动设备
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // 键盘事件监听器
        function setupKeyboardControls() {
            // 键盘按下事件
            document.addEventListener('keydown', function(e) {
                if (['ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    keys[e.key] = true;
                    e.preventDefault(); // 防止页面滚动
                }
            });
            
            // 键盘释放事件
            document.addEventListener('keyup', function(e) {
                if (['ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    keys[e.key] = false;
                    e.preventDefault(); // 防止页面滚动
                }
            });
            
            // 移动端触摸控制
            if (isMobile) {
                leftBtn.addEventListener('touchstart', function(e) {
                    keys.ArrowLeft = true;
                    e.preventDefault();
                });
                
                leftBtn.addEventListener('touchend', function(e) {
                    keys.ArrowLeft = false;
                    e.preventDefault();
                });
                
                rightBtn.addEventListener('touchstart', function(e) {
                    keys.ArrowRight = true;
                    e.preventDefault();
                });
                
                rightBtn.addEventListener('touchend', function(e) {
                    keys.ArrowRight = false;
                    e.preventDefault();
                });
                
                // 防止触摸时页面滚动
                document.addEventListener('touchmove', function(e) {
                    if (gameActive) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
        }
        
        // 初始化游戏
        function initGame() {
            count = 0;
            gameActive = true;
            lives = 3;
            gameSpeed = 5;
            gameWon = false; // 重置游戏胜利状态
            document.getElementById('score').textContent = '0';
            document.querySelector('.game-over').style.display = 'none';
            victoryScreen.style.display = 'none';
            updateLives();
            
            // 清除所有现有的金币和炸弹
            document.querySelectorAll('.jin, .bomb').forEach(item => item.remove());
            
            // 重置盆的位置
            pen.style.left = '0px';
            
            // 重新设置键盘控制
            setupKeyboardControls();
            
            // 开始移动平台
            movePen();
            
            // 开始创建物品
            itemInterval = setInterval(createItem, 800);
        }
        
        // 检查胜利条件
        function checkVictory() {
            if (count >= 50) {
                gameActive = false;
                gameWon = true; // 设置游戏胜利状态
                clearInterval(itemInterval);
                document.getElementById('victoryScore').textContent = count;
                victoryScreen.style.display = 'block';
            }
        }
        
        // 更新生命显示
        function updateLives() {
            const lifeElements = document.querySelectorAll('.life');
            lifeElements.forEach((life, index) => {
                life.style.background = index < lives ? '#f1c40f' : '#7f8c8d';
            });
        }
        
        // 平台移动逻辑
        function movePen() {
            if (!gameActive) return;
            
            const currentLeft = parseInt(pen.style.left) || 0;
            let newLeft = currentLeft;
            
            if (keys.ArrowLeft) {
                newLeft -= penSpeed;
            }
            if (keys.ArrowRight) {
                newLeft += penSpeed;
            }
            
            // 限制盆不能移出屏幕
            if(newLeft < 0) newLeft = 0;
            if(newLeft > document.querySelector('.game-container').clientWidth - pen.offsetWidth) 
                newLeft = document.querySelector('.game-container').clientWidth - pen.offsetWidth;
            
            pen.style.left = newLeft + "px";
            
            requestAnimationFrame(movePen);
        }
        
        // 创建金币或炸弹
        function createItem(){
            if (!gameActive) return;
            
            // 30%概率生成炸弹，70%概率生成金币
            const isBomb = Math.random() < 0.3;
            const item = document.createElement("div");
            item.className = isBomb ? "bomb" : "jin";
            document.querySelector('.game-container').appendChild(item);
            
            // 物品的left值需要随机，最小是0，最大是屏幕宽度-物品宽度
            const maxLeft = document.querySelector('.game-container').clientWidth - item.offsetWidth;
            item.style.left = Math.floor(Math.random() * maxLeft) + "px";
            
            // 物品掉落动画
            const fallInterval = setInterval(function(){
                if(!item.parentNode || !gameActive) {
                    clearInterval(fallInterval);
                    return;
                }
                
                item.style.top = (item.offsetTop || 0) + gameSpeed + "px";
                
                // 判断物品落地，说明没接住，就删除
                if(item.offsetTop > document.querySelector('.game-container').clientHeight - item.offsetHeight - 30){
                    document.querySelector('.game-container').removeChild(item);
                    clearInterval(fallInterval);
                    
                    // 只有金币落地才减血
                    if (!isBomb) {
                        lives--;
                        updateLives();
                        
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                }
                
                // 一边下降一边判断碰撞检测
                if(crashJin(pen, item)){
                    if (isBomb) {
                        // 接到炸弹
                        lives--;
                        updateLives();
                        
                        // 创建爆炸效果
                        const explosion = document.createElement("div");
                        explosion.className = "explosion";
                        explosion.style.left = (pen.offsetLeft + pen.offsetWidth/2 - 30) + "px";
                        explosion.style.top = (pen.offsetTop - 30) + "px";
                        document.querySelector('.game-container').appendChild(explosion);
                        
                        // 添加炸弹效果文字
                        const effect = document.createElement("div");
                        effect.className = "bomb-effect";
                        effect.style.left = (pen.offsetLeft + pen.offsetWidth/2) + "px";
                        effect.style.bottom = "150px";
                        effect.innerHTML = "BOOM!";
                        document.querySelector('.game-container').appendChild(effect);
                        
                        // 移除动画元素
                        setTimeout(() => {
                            if (explosion.parentNode) {
                                explosion.parentNode.removeChild(explosion);
                            }
                            if (effect.parentNode) {
                                effect.parentNode.removeChild(effect);
                            }
                        }, 1000);
                        
                        if (lives <= 0) {
                            endGame();
                        }
                    } else {
                        // 接到金币
                        count++;
                        document.getElementById('score').textContent = count;
                        
                        // 每得10分增加一点速度
                        if (count % 10 === 0) {
                            gameSpeed += 1;
                        }
                        
                        // 检查是否胜利
                        checkVictory();
                        
                        // 添加得分效果
                        const effect = document.createElement("div");
                        effect.className = "catch-effect";
                        effect.style.left = (pen.offsetLeft + pen.offsetWidth/2) + "px";
                        effect.style.bottom = "150px";
                        effect.innerHTML = "+1";
                        document.querySelector('.game-container').appendChild(effect);
                        
                        // 移除动画元素
                        setTimeout(() => {
                            if (effect.parentNode) {
                                effect.parentNode.removeChild(effect);
                            }
                        }, 1000);
                    }
                    
                    document.querySelector('.game-container').removeChild(item);
                    clearInterval(fallInterval);
                }
            }, 16); // 约60fps
        }
        
        // 碰撞检测
        function crashJin(obj1, obj2){
            const rect1 = obj1.getBoundingClientRect();
            const rect2 = obj2.getBoundingClientRect();
            
            return !(rect1.right < rect2.left || 
                    rect1.left > rect2.right || 
                    rect1.bottom < rect2.top || 
                    rect1.top > rect2.bottom);
        }
        
        // 结束游戏
        function endGame() {
            gameActive = false;
            gameWon = false; // 游戏失败
            clearInterval(itemInterval);
            document.getElementById('finalScore').textContent = count;
            document.querySelector('.game-over').style.display = 'block';
        }
        
        // 开始游戏按钮事件
        document.getElementById('startBtn').addEventListener('click', function() {
            startScreen.style.display = 'none';
            initGame();
        });
        
        // 重新开始游戏
        document.querySelector('.game-over .restart-btn').addEventListener('click', function() {
            document.querySelector('.game-over').style.display = 'none';
            initGame();
        });
        
        // 胜利界面的重新开始按钮
        document.querySelector('.victory-screen .restart-btn').addEventListener('click', function() {
            victoryScreen.style.display = 'none';
            initGame();
        });
        
        // 跳转到其他游戏 - 根据游戏状态跳转到不同页面
        document.getElementById('jumpBtn').addEventListener('click', function() {
            if (gameWon) {
                // 游戏胜利后跳转到网页1
                window.location.href = "../主线/nvzhu/html/end4.html";
            } else {
                // 游戏失败或未开始跳转到网页2
                window.location.href = "../主线/nvzhu/html/2-1-1.html";
            }
        });
        
        // 初始化键盘控制
        setupKeyboardControls();
    </script>
</body>
</html>
